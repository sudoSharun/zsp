ShortDescription: Command-line client for Zoho Sprints.
Description: |-
  Drive Zoho Sprints from your terminal: list sprints, create and update work
  items, log time and post comments without opening the web UI.

  Every command supports --json for scripting, and every write supports
  --dry-run, which prints the request and sends nothing. Human-readable names
  are accepted instead of 19-digit ids.

  Ships as a self-contained binary; no Python installation required.

  Not affiliated with or endorsed by Zoho Corporation.
